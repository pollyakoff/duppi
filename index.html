<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПОЛЯКОВ ДАНИЛА</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Space Grotesk', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Y2K сетка на фоне */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      width: 90%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
      z-index: 1;
    }

    /* Шапка */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .name {
      font-size: clamp(32px, 6vw, 64px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .name span {
      color: transparent;
      -webkit-text-stroke: 1px #f0f0f0;
    }

    .role {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #666;
      text-align: right;
    }

    /* Видео */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #111;
      border: 1px solid #222;
      overflow: hidden;
    }

    /* Y2K уголки */
    .video-wrapper::before,
    .video-wrapper::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      z-index: 2;
    }

    .video-wrapper::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid #fff;
      border-left: 2px solid #fff;
    }

    .video-wrapper::after {
      bottom: -1px;
      right: -1px;
      border-bottom: 2px solid #fff;
      border-right: 2px solid #fff;
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Нижняя строка */
    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #444;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Кнопки */
    .links {
      display: flex;
      gap: 8px;
    }

    .link-btn {
      text-decoration: none;
      color: #666;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 8px 16px;
      border: 1px solid #222;
      transition: all 0.2s ease;
      position: relative;
    }

    .link-btn:hover {
      color: #f0f0f0;
      border-color: #f0f0f0;
      background: rgba(255,255,255,0.05);
    }

    /* Y2K пиксельный hover эффект */
    .link-btn::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: -4px;
      width: 100%;
      height: 100%;
      border: 1px solid #333;
      transition: all 0.2s ease;
      pointer-events: none;
    }

    .link-btn:hover::after {
      border-color: #555;
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      <div class="name">Danila <span>Poliakov</span></div>
      <div class="role">Motion Designer<br>Visual Artist</div>
    </div>

    <div class="video-wrapper">
      <!-- Вставь свою ссылку с Vimeo или YouTube -->
      <!-- Vimeo: src="https://kinescope.io/tqwq79mQeuEoDLyyDWNUkz" -->
      <!-- YouTube: src="https://kinescope.io/tqwq79mQeuEoDLyyDWNUkz" -->
      <iframe 
        src="https://kinescope.io/tqwq79mQeuEoDLyyDWNUkz"
        allow="autoplay; fullscreen"
        allowfullscreen>
      </iframe>
    </div>

    <div class="footer-row">
      <div class="status">Available for work</div>
      <div class="links">
        <a href="https://t.me/твой_ник" class="link-btn" target="_blank">TG</a>
        <a href="https://instagram.com/твой_ник" class="link-btn" target="_blank">IG</a>
        <a href="https://behance.net/твой_ник" class="link-btn" target="_blank">BE</a>
      </div>
    </div>

  </div>

</body>
</html>
